version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — desarrollo local con 2 servicios separados
# (espejo exacto de la arquitectura en Cloud Run)
#
#   rag-api → http://localhost:5000   (Flask API)
#   rag-gui → http://localhost:8501   (Streamlit)
#
# Uso:
#   docker compose up --build     # primera vez
#   docker compose up             # siguientes veces
#   docker compose down           # detener
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Servicio 1: Flask API ────────────────────────────────────────────────
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Servicio 2: Streamlit GUI ────────────────────────────────────────────
  rag-gui:
    build:
      context: .
      dockerfile: Dockerfile.gui
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - PORT=8501
      - PYTHONUNBUFFERED=1
      # En local, la GUI llama a la API en el servicio de arriba
      - API_URL=http://rag-api:5000
    depends_on:
      rag-api:
        condition: service_healthy
    restart: unless-stopped
